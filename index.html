<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <title>POS UMKM</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#f1f5f9}body{overflow:hidden}.app{height:100%;display:flex;flex-direction:column}.topbar{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#2563eb;color:#fff;box-shadow:0 2px 12px #0f172a33;z-index:2}.brand{font-weight:800;letter-spacing:.2px}.status{font-size:12px;opacity:.9}.offline{background:#f59e0b;color:#422006}.frame{border:0;flex:1;width:100%;background:#fff}.install{display:none;position:fixed;right:16px;bottom:18px;border:0;border-radius:14px;padding:13px 16px;background:#2563eb;color:white;font-weight:800;box-shadow:0 8px 24px #2563eb55;z-index:5}
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar"><span class="brand">POS UMKM</span><span id="status" class="status">Menghubungkan...</span></header>
    <iframe id="appFrame" class="frame" title="POS UMKM" allow="camera; microphone"></iframe>
  </main>
  <button id="install" class="install">Install POS UMKM</button>
  <script>
    // Ganti URL ini dengan URL Web App Apps Script terbaru Anda.
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyFg3hwNpiYVvWOd7Fjime1i3hx3W9pOPEuuSqtkiW3gRIVm6ZAnWBZV1r7WV5zaf6xuQ/exec';
    const frame = document.getElementById('appFrame');
    const status = document.getElementById('status');
    frame.src = APPS_SCRIPT_URL;
    function updateStatus(){
      const online = navigator.onLine;
      status.textContent = online ? 'Online' : 'Offline';
      status.classList.toggle('offline', !online);
    }
    window.addEventListener('online', updateStatus);
    window.addEventListener('offline', updateStatus);
    updateStatus();
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(console.warn);
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt=e; document.getElementById('install').style.display='block'; });
    document.getElementById('install').onclick = async () => { if (!deferredPrompt) return; deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt=null; document.getElementById('install').style.display='none'; };
  </script>
</body>
</html>
